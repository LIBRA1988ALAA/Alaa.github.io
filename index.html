<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAAMOR · Greetings</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Dancing+Script:wght@500&family=Montserrat:wght@500;600&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0d0818}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;color:#fff;font:16px/1.5 Montserrat,Tajawal,system-ui,sans-serif;background:radial-gradient(120% 90% at 50% 0,var(--bg2),var(--bg1) 70%) fixed;--bg1:#1a0f2e;--bg2:#3d1a52;--ac:#f6c76a;--ac2:#ff7ab6}
body[data-t=vl]{--bg1:#2a0a14;--bg2:#5e1230;--ac:#ff6b86;--ac2:#ffd1da}
body[data-t=xm]{--bg1:#06251b;--bg2:#10503a;--ac:#f2c14e;--ac2:#e5484d}
body[data-t=ny]{--bg1:#060b1f;--bg2:#17215a;--ac:#e9d8a6;--ac2:#7aa2ff}
[hidden]{display:none!important}
header{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 14px 0}
#langs{align-self:flex-end;display:flex;gap:6px}
#langs button{background:none;border:1px solid #fff3;color:#fffc;border-radius:8px;padding:4px 10px;font:600 12px Montserrat,Tajawal,sans-serif;cursor:pointer}
#langs button[aria-pressed=true]{border-color:var(--ac);color:var(--ac)}
#tabs{display:flex;gap:8px;max-width:100%;overflow-x:auto;padding:4px}
#tabs button{flex:none;border:1px solid #fff3;background:#ffffff0d;color:#fff;border-radius:99px;padding:9px 18px;font:600 14px Montserrat,Tajawal,sans-serif;cursor:pointer;transition:background .25s,color .25s}
#tabs button[aria-pressed=true]{background:var(--ac);color:#14101c;border-color:var(--ac)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 18px 28px}
.card{width:100%;max-width:420px;display:grid;gap:14px;padding:24px;border-radius:24px;background:#ffffff10;border:1px solid #ffffff26;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px #0006}
label{display:grid;gap:6px;font-size:13px;color:#fffc}
input,textarea{width:100%;background:#0003;border:1px solid #fff3;color:#fff;border-radius:12px;padding:12px 14px;font:16px Montserrat,Tajawal,sans-serif;resize:none}
.btn{border:0;border-radius:99px;padding:13px 26px;background:var(--ac);color:#14101c;font:700 15px Montserrat,Tajawal,sans-serif;cursor:pointer;box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn.ghost{background:#ffffff14;color:#fff;box-shadow:none;border:1px solid #fff4;padding:10px 20px;font-size:14px}
.btn.ghost[aria-pressed=true]{background:var(--ac);color:#14101c}
#stage{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#cnt{font:600 14px Montserrat,sans-serif;color:var(--ac);letter-spacing:.12em}
#area{display:grid;place-items:center;width:100%;min-height:min(50vh,360px)}
#bl,#num{grid-area:1/1}
#bl{position:relative;width:min(52vw,210px);aspect-ratio:.82;border:0;padding:0;border-radius:50% 50% 47% 47%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 26%,#fffa 0 7%,#fff0 26%),radial-gradient(circle at 50% 62%,var(--bc),color-mix(in srgb,var(--bc) 55%,#000));box-shadow:inset -10px -14px 30px #0004,0 20px 60px color-mix(in srgb,var(--bc) 45%,transparent);cursor:pointer;animation:rise .7s cubic-bezier(.2,1.3,.4,1),sway 3.5s ease-in-out .7s infinite}
#bl::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:14px;background:var(--bc);transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,0 100%)}
#bl::before{content:"";position:absolute;left:50%;top:100%;width:2px;height:80px;margin-top:2px;background:#fff5}
#num{font:italic 700 clamp(7rem,38vw,11rem)/1 'Cormorant Garamond',serif;text-shadow:0 0 30px currentColor;animation:numin .55s cubic-bezier(.2,1.4,.4,1)}
#hint{margin:0;font-size:14px;color:#fffb}
#show{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:560px;width:100%}
.ic{width:min(58vw,230px);height:auto;animation:drop .9s cubic-bezier(.2,1.2,.4,1)}
.yr{font:italic 700 clamp(4.5rem,22vw,7.5rem)/1.1 'Cormorant Garamond',serif;color:var(--ac);text-shadow:0 0 28px color-mix(in srgb,var(--ac) 60%,transparent);animation:drop .9s both}
.hb{transform-origin:50% 55%;animation:beat 1.3s ease-in-out infinite}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fk .18s ease-in-out infinite alternate}
.l{animation:tw 1.4s ease-in-out infinite alternate}
#ttl,#who{margin:0;font-family:'Cormorant Garamond','Aref Ruqaa',serif;font-style:italic;font-weight:700;line-height:1.1}
#ttl{font-size:clamp(2.4rem,10vw,4.2rem);text-shadow:0 0 12px color-mix(in srgb,var(--ac) 70%,transparent),0 0 38px color-mix(in srgb,var(--ac) 40%,transparent);animation:fadeup 1s .6s both;margin-top:10px}
#who{font-size:clamp(2.6rem,11vw,4.6rem);color:var(--ac);text-shadow:0 0 14px color-mix(in srgb,var(--ac) 65%,transparent),0 0 40px color-mix(in srgb,var(--ac) 35%,transparent);animation:fadeup 1s .9s both}
html[lang=ar] #ttl,html[lang=ar] #who{font-style:normal}
#txt{margin:14px 0 0;min-height:5em;max-width:30ch;font:500 clamp(1.4rem,5.6vw,1.95rem)/1.5 'Dancing Script','Aref Ruqaa',cursive;color:#fff}
html[lang=ar] #txt{font-weight:400;line-height:1.9}
.acts{display:flex;gap:10px;margin-top:8px}
footer{position:relative;z-index:1;text-align:center;padding:14px 0 18px .3em;font:600 11px Montserrat,sans-serif;letter-spacing:.3em;color:var(--ac);opacity:.85}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
@keyframes rise{from{transform:translateY(140px) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes numin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-60px) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(.98)}45%{transform:scale(1.06)}}
@keyframes fk{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
@keyframes tw{from{opacity:.35}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

body[data-t=bd] main{padding-bottom:17vh}
body[data-t=bd] #langs button{border-color:#3a2a3f33;color:#3a2a3fcc;background:#ffffff80}
body[data-t=bd] #langs button[aria-pressed=true]{border-color:#b8893a;color:#8f6a2a}
body[data-t=bd] #tabs button{background:#ffffffb3;border-color:#fff;color:#3a2a3f;box-shadow:0 4px 14px #c9a24a22}
body[data-t=bd] #tabs button[aria-pressed=true]{background:linear-gradient(135deg,#efd48a,#c9a24a);color:#3a2a1a}
body[data-t=bd] .card{background:#ffffff99;border-color:#fffc;box-shadow:0 24px 60px #c9a24a2e,0 4px 18px #e79ab033}
body[data-t=bd] label{color:#6f5d73}
body[data-t=bd] input,body[data-t=bd] textarea{background:#ffffffcc;border-color:#e8d5dc;color:#3a2a3f}
body[data-t=bd] .btn{background:linear-gradient(135deg,#efd48a,#c9a24a);color:#3a2a1a;box-shadow:0 8px 22px #c9a24a55}
body[data-t=bd] .btn.ghost{background:#ffffffb3;color:#3a2a3f;border-color:#fff;box-shadow:0 4px 14px #c9a24a22}
body[data-t=bd] .btn.ghost[aria-pressed=true]{background:linear-gradient(135deg,#efd48a,#c9a24a);color:#3a2a1a}
body[data-t=bd] #cnt{color:#8f6a2a}
body[data-t=bd] #hint{color:#6f5d73}
body[data-t=bd] #bl::before{background:#c9a24a99}
body[data-t=bd] #num{text-shadow:0 0 22px #fff,0 0 6px #fff}
body[data-t=bd] #ttl{color:#4a2f55;text-shadow:0 0 14px #fff,0 0 34px #efd48acc}
body[data-t=bd] #who{color:#b8893a;text-shadow:0 0 14px #fff,0 0 32px #efd48a}
body[data-t=bd] #txt{color:#5b4560;text-shadow:0 0 10px #fff}
body[data-t=bd] footer{color:#8f6a2a;text-shadow:0 0 8px #fff}
#bg{display:grid;justify-items:center}
#bg .pl{grid-area:1/1;height:100%;aspect-ratio:768/1376;background:var(--img) center/100% 100%;pointer-events:none;will-change:transform}
#bg .bA,#bg .bB{-webkit-mask-composite:source-in;mask-composite:intersect}
#bg .bA{-webkit-mask-image:linear-gradient(to right,#000 30%,transparent 52%),linear-gradient(#000 52%,transparent 72%);mask-image:linear-gradient(to right,#000 30%,transparent 52%),linear-gradient(#000 52%,transparent 72%);animation:fA 7s ease-in-out infinite}
#bg .bB{-webkit-mask-image:linear-gradient(to left,#000 30%,transparent 52%),linear-gradient(#000 52%,transparent 72%);mask-image:linear-gradient(to left,#000 30%,transparent 52%),linear-gradient(#000 52%,transparent 72%);animation:fB 8.5s ease-in-out -3s infinite}
#bg .gf{-webkit-mask-image:linear-gradient(transparent 52%,#000 66%);mask-image:linear-gradient(transparent 52%,#000 66%);transform-origin:50% 100%;animation:br 6s ease-in-out infinite}
#bg .sh{background:linear-gradient(110deg,transparent 42%,#fff 50%,transparent 58%) 0 0/250% 100%;-webkit-mask-image:linear-gradient(transparent 62%,#000 76%);mask-image:linear-gradient(transparent 62%,#000 76%);mix-blend-mode:soft-light;animation:shn 7s ease-in-out infinite}
@keyframes fA{0%,100%{transform:translate(0,0)}50%{transform:translate(.6%,-1.8%)}}
@keyframes fB{0%,100%{transform:translate(0,-1.4%)}50%{transform:translate(-.6%,0)}}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes shn{0%{background-position:0 0}65%,100%{background-position:100% 0}}
#txt{position:relative;width:100%;max-width:min(100%,440px);min-height:5.2em;padding:20px 24px;border-radius:22px;font-size:clamp(1.3rem,5vw,1.7rem);background:var(--fb,#ffffff14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 6px var(--fo,#ffffff0d),0 16px 44px var(--fs,#0004);outline:1px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:-9px;transition:opacity .8s}
#txt:empty{opacity:0}
#txt::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(135deg,var(--ac),var(--ac2),var(--ac));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
body[data-t=bd]{--fb:#ffffffb8;--fo:#ffffff73;--fs:#c9a24a30}
body[data-t=bd] #txt::before{background:linear-gradient(135deg,#f3dc9a,#c9a24a 40%,#f2b8c6 70%,#e8c875)}

.cakew{--w:min(42vw,200px);--fx:49.86%;--fb:83.66%;position:relative;width:var(--w);aspect-ratio:440/728;perspective:900px;animation:drop .9s cubic-bezier(.2,1.2,.4,1)}
.cakew .sd{position:absolute;left:12%;right:12%;bottom:-1%;height:5%;background:radial-gradient(closest-side,#4a2f5559,#4a2f5500);filter:blur(5px)}
.ckr{position:absolute;inset:0;transform-style:preserve-3d;animation:spn 9s ease-in-out infinite}
.ckb,.cks{position:absolute;inset:0}
.ckb{background:var(--cake) center/100% 100% no-repeat}
.cks{-webkit-mask:var(--cake) center/100% 100% no-repeat;mask:var(--cake) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 38%,#ffffffb3 50%,transparent 62%) 0 0/300% 100% no-repeat;mix-blend-mode:soft-light;animation:cshn 5s ease-in-out infinite}
.fa{position:absolute;left:var(--fx);bottom:var(--fb);width:0;height:0}
.fa .gw{position:absolute;left:calc(var(--w)*-.4);bottom:calc(var(--w)*-.3);width:calc(var(--w)*.8);aspect-ratio:1;background:radial-gradient(circle,#ffd56bcc,#ffd56b00 65%);animation:pls 1.8s ease-in-out infinite alternate}
.fa .fm{position:absolute;left:calc(var(--w)*-.045);bottom:-3px;width:calc(var(--w)*.09);height:auto;transform-origin:50% 100%;animation:fk .2s ease-in-out infinite alternate;filter:drop-shadow(0 0 5px #ffb02e)}
@keyframes spn{0%,100%{transform:rotateY(-18deg)}50%{transform:rotateY(18deg)}}
@keyframes cshn{0%{background-position:100% 0}70%,100%{background-position:0 0}}
@keyframes pls{from{opacity:.7;transform:scale(.94)}to{opacity:1;transform:scale(1.08)}}
#show{position:relative;isolation:isolate}
#cf{position:absolute;left:50%;top:-6px;width:min(100vw,860px);height:440px;transform:translateX(-50%);pointer-events:none;z-index:-1}
#cf i{position:absolute;display:block;width:var(--s);height:calc(var(--s)*1.7);background:var(--c);border-radius:2px;opacity:.9;animation:cfa var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes cfa{from{transform:translate(0,0) rotate3d(1,1,0,0deg)}to{transform:translate(var(--dx),var(--dy)) rotate3d(1,1,0,300deg)}}

/* ---------- audio ---------- */
let AC;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function popSnd(){try{const a=ac(),n=a.sampleRate*.16|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=.55;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
function play(n,b,ty){try{const a=ac();let t=a.currentTime+.08;n.forEach(([m,d])=>{const o=a.createOscillator(),g=a.createGain(),e=t+d*b;o.type=ty;o.frequency.value=440*2**((m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.22,t+.03);g.gain.exponentialRampToValueAtTime(.0001,e);o.connect(g);g.connect(a.destination);o.start(t);o.stop(e+.05);t=e})}catch(e){}}
const M=[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,1],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2.5]];
const tune=()=>play(M,.42,'triangle');
const chime=()=>play([[72,.5],[76,.5],[79,.5],[84,2]],.35,'sine');

/* ---------- particles ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],W=0,H=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);
function emit(k,x,y,n,cols,o={}){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(o.sp||6)*Math.random()+1;P.push({k,x,y,vx:o.fall?(Math.random()-.5)*1.2:Math.cos(a)*s,vy:o.fall?(o.up?-1:1)*(1+Math.random()*1.5):Math.sin(a)*s,g:o.g??.15,l:1,d:o.d||.015,c:cols[i%cols.length],s:o.sz?o.sz*(.5+Math.random()):4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.3})}}
function fr(){cx.clearRect(0,0,W,H);P=P.filter(p=>p.l>0&&p.y<H+40&&p.y>-80);for(const p of P){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l-=p.d;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;if(p.k=='h'){cx.font=p.s*3+'px serif';cx.fillText('♥',p.x,p.y)}else if(p.k=='c'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}else{cx.beginPath();cx.arc(p.x,p.y,p.s/3,0,6.3);cx.fill()}}cx.globalAlpha=1;requestAnimationFrame(fr)}
let tk=0;
setInterval(()=>{if(RM||document.hidden)return;tk++;const t=document.body.dataset.t;
 if(t=='bd'&&tk%3==0)emit('c',Math.random()*W,-10,1,PAL.bd,{fall:1,g:.01,d:.002});
 if(t=='bd'&&tk%2==0)emit('s',Math.random()*W,H*(.74+Math.random()*.22),1,['#e8c875','#fff3c4'],{fall:1,up:1,g:-.001,d:.012,sz:5});
